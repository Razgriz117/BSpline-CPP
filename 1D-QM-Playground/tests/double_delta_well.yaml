# Known-solution fixture: double delta well (two-site tunneling),
#   V(x) = -delta(x+1) - delta(x-1)
# Even/odd doublet satisfies kappa = 1 +/- exp(-2*kappa), even state lower.
# See TestDoubleDeltaWellBoundStates / TestKnownSolutionConfigFilesLoadAndRun.
run:
  run_tise:     true
  run_tdse:     false
  run_analysis: true
  output_dir:   "./data/double_delta_well"
bspline:
  n_nodes: 161
  order:   8
  domain:  [-20.0, 20.0]
potential:
  - "{'domain': '[-20, 20]', 'function': '0'}"
potential_deltas:
  - {x: -1.0, strength: -1.0}
  - {x:  1.0, strength: -1.0}
tise:
  n_pts_eigenstate: 301
  error_threshold:  1.0e-10
  continuum:
    enabled: false
visualization:
  spectrum_overview: true
  eigenstates:       true
