# config.yaml — 1D QM Playground
# Single source of truth for a simulation run.
# Read by the Python controller (controller.py) and passed to each solver binary.

# ─── Run control ──────────────────────────────────────────────────────────────
run:
  run_tise:     true
  run_tdse:     false
  run_analysis: false
  output_dir:   "./data"

# ─── Physical constants ───────────────────────────────────────────────────────
physics:
  mass: 1.0    # particle mass
  hbar: 1.0    # reduced Planck constant

# ─── B-spline basis ───────────────────────────────────────────────────────────
bspline:
  n_nodes: 51
  order:   12
  domain:  [0.0, 100.0]

# ─── Potential (piecewise, expressions in x) ──────────────────────────────────
# Each entry is a string encoding a dict with two keys:
#   domain   — interval notation: use [ ] for closed bounds, ( ) for open bounds.
#              e.g. "(0, 100]" means 0 < x <= 100. Supports inf: "[0, inf)".
#   function — a mathematical expression in x with literal numeric constants.
#              No variable references to other config fields are supported;
#              all constants (including centrifugal terms) must be baked in.
#
# Example (hydrogen-like, L=1 effective potential -- domain declared
# UNBOUNDED, '(0, inf)' not '(0, 100]': the true Coulomb tail extends past
# the box; declaring it as such is what lets classifyAsymptote recognize
# and Coulomb-match it -- see tise.continuum.l below):
#   - "{'domain': '(0, inf)', 'function': '-1/x + 1/x^2'}"
#
# Example (particle in a box with a barrier at x in [5, 6]):
#   - "{'domain': '[0, 5)',  'function': '0'}"
#   - "{'domain': '[5, 6]',  'function': '10'}"
#   - "{'domain': '(6, 10]', 'function': '0'}"
potential:
  - "{'domain': '(0, inf)', 'function': '-1/x + 1/x^2'}"

# ─── TISE solver ──────────────────────────────────────────────────────────────
tise:
  n_pts_eigenstate: 301       # spatial grid points for eigenstate output
  error_threshold:  1.0e-10   # eigenvalue accuracy cutoff for reporting

  continuum:
    enabled:     true
    E_threshold: 0.0          # lower bound of continuum spectrum range
    E_max:       10.0         # upper bound of continuum spectrum range
    n_energies:  100          # number of energy points in [E_threshold, E_max]
    n_pts:       500          # spatial grid points per continuum state output
    l:           1            # angular momentum for Coulomb-tail continuum matching
                               # (ADR-0009 supersedes ADR-0010) -- must match the
                               # centrifugal term l(l+1)/2x^2 baked into `function`
                               # above (1*2/2=1, matching the "+1/x^2" term); cannot
                               # be inferred automatically since a centrifugal term
                               # decays faster than the 1/x Coulomb term and is
                               # asymptotically invisible to the tail-shape fit.
                               # Defaults to 0 (s-wave) if omitted.

# ─── TDSE solver ──────────────────────────────────────────────────────────────
tdse:
  initial_state:
    type:  eigenstate   # eigenstate | gaussian
    index: 0            # (eigenstate only) 0-indexed bound state
    # position: 10.0   # (gaussian only) wavepacket center
    # momentum:  0.0   # (gaussian only) mean momentum
    # width:     1.0   # (gaussian only) Gaussian width

  operator:
    gauge: length        # length (x_hat coupling) | velocity (p_hat coupling)

  field:                 # time-dependent driving field E(t); optional
    enabled: false
    # literal-constant math expression in t, same rule as `potential.function`
    expression: "0.05 * exp(-((t-50)^2)/(2*10^2)) * cos(0.2*t)"

  dt:                0.3     # integration time step (numerical propagation, not just output cadence)
  t_final:         300.0
  snapshot_interval: 10      # steps of dt between wavefunction snapshot writes

# ─── Analysis (computed from TISE + TDSE output) ──────────────────────────────
# Requires run_tdse: true — all quantities are functions of |Psi(t)>.
# See docs/planning/architecture-07-02.md for the underlying math.
analysis:
  bound_state_populations: true   # p_n(t)      = |<phi_n|Psi(t)>|^2
  asymptotic_populations:  true   # p_n(inf)    = |<phi_n|Psi(t_final)>|^2
  asymptotic_distribution: true   # dP_a/dE     = |<psi^-_{a,E}|Psi(t_final)>|^2
                                   #   (requires tise.continuum.enabled: true)
  expectation_values:
    x: true    # <x_hat>(t)
    p: true    # <p_hat>(t)
    T: true    # <T_hat>(t)  kinetic energy
    V: true    # <V_hat>(t)  potential energy
    H: true    # <H_hat>(t)  total energy
  interval_probability:           # optional: P_[xa,xb](t) = integral_xa^xb |psi(x,t)|^2 dx
    enabled: false
    intervals:
      - [0.0, 5.0]

# ─── Visualization (what to plot; boolean toggles only) ───────────────────────
visualization:
  eigenstates:               true   # TISE:     |phi_n(x)|^2 for bound states
  phase_shifts:              true   # TISE:     delta(E), d(delta)/dE (requires tise.continuum.enabled)
  time_evolution:            true   # TDSE:     |Psi(x,t)|^2 heatmap/animation (requires run_tdse)
  bound_state_populations:   true   # Analysis: p_n(t)
  asymptotic_populations:    true   # Analysis: p_n(inf) bar chart
  asymptotic_distribution:   true   # Analysis: dP_a/dE (requires tise.continuum.enabled)
  expectation_values:        true   # Analysis: <O>(t) for each enabled operator
